name: CI & Security Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}
# description:   cont#ents: read

jobs:
  validate-and-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
    #     uses: actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JavaScript Syntax Check
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} +

      - name: JSON & Web Manifest Validation
        run: |
          node -e '
            const fs = require("fs");
            const files = ["manifest.webmanifest", "vercel.json"];
            const glob = require("child_process").execSync("find . -name \"*.json\" -not -path \"./node_modules/*\"").toString().split("\n").filter(Boolean);
            const allFiles = Array.from(new Set([...files, ...glob]));
            allFiles.forEach(file => {
              if (fs.existsSync(file)) {
                console.log("Validating JSON file:", file);
                JSON.parse(fs.readFileSync(file, "utf8"));
              }
            });
          '

      - name: Verify HTTP Security Headers & Sanitization Regression Suite
        run: |
          node -e '
            const fs = require("fs");
            const content = fs.readFileSync("vercel.json", "utf8");
            const headers = [
              "Strict-Transport-Security",
              "Content-Security-Policy",
              "X-Frame-Options",
              "X-Content-Type-Options",
              "Cross-Origin-Opener-Policy"
            ];
            headers.forEach(h => {
              if (!content.includes(h)) throw new Error("Missing header: " + h);
            });

            let input = "<<script>script>alert(1)<</script>/script>";
            let prev;
            do {
              prev = input;
              input = input.replace(/<[^>]*>/gi, "");
            } while (input !== prev);
            if (input !== "alert(1)") throw new Error("Sanitization regression check failed: " + input);
          '

      - name: Secret & Governance Audit
        run: |
          if git ls-files | grep -q -E '(^|/)\.env($|\.)'; then
            echo "Error: .env file tracked in git"
            exit 1
          fi

          if git grep -q -i "-----BEGIN" -- ':!.github/workflows/ci.yml'; then
            echo "Error: Private key header found in tracked files"
            exit 1
          fi

          FILES=("index.html" "LICENSE" "SECURITY.md" "README.md" "CONTRIBUTING.md" "CODE_OF_CONDUCT.md")
          for f in "${FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "Error: Required file $f missing or empty"
              exit 1
            fi
            echo "Verified $f exists and is non-empty."
          done
 
